name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger from Actions tab

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stats directory
        run: mkdir -p stats

      - name: Generate GitHub Stats Card
        run: |
          # Self-hosted instance with PAT_1 configured server-side on Vercel
          # → includes ALL private repos data
          curl --fail -s \
            "https://github-readme-stats-five-dusky-24.vercel.app/api?username=RajaMuhammadAwais&show_icons=true&theme=tokyonight&count_private=true&hide_border=true&include_all_commits=true" \
            -o stats/github-stats.svg
          echo "GitHub Stats Card generated: $(wc -c < stats/github-stats.svg) bytes"

      - name: Generate Top Languages Card
        run: |
          curl --fail -s \
            "https://github-readme-stats-five-dusky-24.vercel.app/api/top-langs?username=RajaMuhammadAwais&layout=compact&theme=tokyonight&hide_border=true" \
            -o stats/top-langs.svg
          echo "Top Languages Card generated: $(wc -c < stats/top-langs.svg) bytes"

      - name: Generate Contribution Streak Card
        run: |
          curl --fail -s "https://github-readme-streak-stats.herokuapp.com/?user=RajaMuhammadAwais&theme=tokyonight&hide_border=true" \
            -o stats/streak-stats.svg
          echo "Streak Card generated: $(wc -c < stats/streak-stats.svg) bytes"

      - name: Generate Contribution Activity Graph
        run: |
          curl --fail -s \
            "https://github-readme-activity-graph.vercel.app/graph?username=RajaMuhammadAwais&theme=tokyonight&hide_border=true&area=true" \
            -o stats/activity-graph.svg
          echo "Activity Graph generated: $(wc -c < stats/activity-graph.svg) bytes"

      - name: Auto-commit generated stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Auto-update GitHub stats SVGs [skip ci]"
          file_pattern: stats/*.svg
          commit_user_name: "Raja Muhammad Awais"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

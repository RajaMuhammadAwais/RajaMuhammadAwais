      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#b)" />
  <rect x="34" y="32" width="1332" height="496" rx="24" fill="#07121f" stroke="#12364f" stroke-width="2" />
  <rect x="54" y="52" width="1292" height="456" rx="18" fill="#050913" stroke="#1e3a4a" stroke-width="2" />

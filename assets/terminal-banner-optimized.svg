  <g transform="translate(520 220)"><rect x="0" y="0" width="300" height="220" rx="10" fill="#050816" stroke="#1d2d41" /><text x="20" y="60" font-family="'Cascadia Code', Consolas, monospace" font-size="16" fill="#4ef2b2">$ whoami</text><text x="20" y="84" font-family="'Cascadia Code', Consolas, monospace" font-size="15" fill="#00e5ff">Raja Muhammad Awais</text><text x="20" y="112" font-family="'Cascadia Code', Consolas, monospace" font-size="16" fill="#4ef2b2">$ skills</text><text x="20" y="136" font-family="'Cascadia Code', Consolas, monospace" font-size="14" fill="#8ff0d6">Linux Docker Kubernetes Terraform AWS</text><text x="20" y="158" font-family="'Cascadia Code', Consolas, monospace" font-size="14" fill="#8ff0d6">Python FastAPI Node.js NestJS React</text><text x="20" y="180" font-family="'Cascadia Code', Consolas, monospace" font-size="16" fill="#4ef2b2">$ status</text><text x="20" y="204" font-family="'Cascadia Code', Consolas, monospace" font-size="15" fill="#00e5ff">READY</text></g>

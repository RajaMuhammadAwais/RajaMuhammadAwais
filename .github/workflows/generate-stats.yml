name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create stats directory
        run: mkdir -p stats

      - name: Generate GitHub Stats Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: RajaMuhammadAwais
          OUTPUT_DIR: stats
        run: python scripts/generate-profile-stats.py

      - name: Generate Contribution Streak Card
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            "https://github-readme-streak-stats.herokuapp.com/?user=RajaMuhammadAwais&theme=tokyonight&hide_border=true" \
            -o stats/streak-stats.svg
          echo "Streak Card generated: $(wc -c < stats/streak-stats.svg) bytes"

      - name: Generate Contribution Activity Graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: RajaMuhammadAwais
          OUTPUT_PATH: stats/activity-graph.svg
        run: python scripts/generate-activity-graph.py

      - name: Validate generated SVGs
        run: |
          for svg in stats/*.svg; do
            test -s "$svg"
            grep -q '<svg' "$svg"
            echo "Validated $svg ($(wc -c < "$svg") bytes)"
          done

      - name: Auto-commit generated stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Auto-update GitHub stats SVGs [skip ci]"
          file_pattern: stats/*.svg
          commit_user_name: "Raja Muhammad Awais"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

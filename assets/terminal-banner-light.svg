<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="100%" height="auto" role="img" aria-label="Light themed animated terminal banner for Raja Muhammad Awais">
  <title>Raja Muhammad Awais Terminal Banner Light</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f8ff" />
      <stop offset="50%" stop-color="#eef4ff" />
      <stop offset="100%" stop-color="#e7edff" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f7ff" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)" />
  <rect x="34" y="32" width="1332" height="496" rx="24" fill="url(#panel)" stroke="#cad8f5" stroke-width="2" />
  <rect x="54" y="52" width="1292" height="456" rx="18" fill="#fdfefe" stroke="#dce7ff" stroke-width="2" />
  <g transform="translate(74 72)">
    <circle cx="0" cy="0" r="7" fill="#ff6b6b" />
    <circle cx="24" cy="0" r="7" fill="#fbbf24" />
    <circle cx="48" cy="0" r="7" fill="#34d399" />
  </g>
  <rect x="74" y="108" width="1252" height="372" rx="14" fill="#f8fbff" stroke="#dce7ff" stroke-width="2" />
  <text x="700" y="148" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="26" font-weight="700" fill="#0f172a" letter-spacing="3" filter="url(#glow)">RAJA MUHAMMAD AWAIS</text>
  <text x="700" y="182" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#1d4ed8" letter-spacing="2">DEVOPS • AI • CYBER SECURITY • CLOUD • KUBERNETES</text>
  <text x="110" y="220" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Initializing DevOps Environment...
    <animate attributeName="textLength" values="0;520" dur="1.1s" begin="0.2s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.1s" begin="0.2s" fill="freeze" />
  </text>
  <text x="110" y="250" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Loading AI Models...
    <animate attributeName="textLength" values="0;420" dur="1.0s" begin="1.0s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.0s" begin="1.0s" fill="freeze" />
  </text>
  <text x="110" y="280" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Connecting Kubernetes Cluster...
    <animate attributeName="textLength" values="0;560" dur="1.2s" begin="2.0s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.2s" begin="2.0s" fill="freeze" />
  </text>
  <text x="110" y="310" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Scanning Infrastructure...
    <animate attributeName="textLength" values="0;500" dur="1.1s" begin="3.2s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.1s" begin="3.2s" fill="freeze" />
  </text>
  <text x="110" y="340" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Checking Docker Images...
    <animate attributeName="textLength" values="0;500" dur="1.0s" begin="4.3s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.0s" begin="4.3s" fill="freeze" />
  </text>
  <text x="110" y="370" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Loading Cloud Services...
    <animate attributeName="textLength" values="0;500" dur="1.0s" begin="5.3s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.0s" begin="5.3s" fill="freeze" />
  </text>
  <text x="110" y="400" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Building RAG Knowledge Base...
    <animate attributeName="textLength" values="0;580" dur="1.2s" begin="6.3s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.2s" begin="6.3s" fill="freeze" />
  </text>
  <text x="110" y="430" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18" fill="#0f766e" letter-spacing="1">
    <tspan fill="#2563eb">[boot]</tspan> Verifying Security Policies...
    <animate attributeName="textLength" values="0;560" dur="1.1s" begin="7.5s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="1.1s" begin="7.5s" fill="freeze" />
  </text>
  <text x="110" y="460" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="20" fill="#1d4ed8" letter-spacing="1" filter="url(#glow)">
    <tspan fill="#0f766e">[ok]</tspan> System Ready.
    <animate attributeName="textLength" values="0;320" dur="0.9s" begin="8.6s" fill="freeze" />
    <animate attributeName="lengthAdjust" values="spacingAndGlyphs" dur="0.9s" begin="8.6s" fill="freeze" />
  </text>
  <g transform="translate(520 220)">
    <rect x="0" y="0" width="300" height="220" rx="10" fill="#f8fbff" stroke="#c7d2fe" stroke-width="1.5" />
    <rect x="12" y="12" width="276" height="22" rx="6" fill="#eef4ff" />
    <circle cx="28" cy="23" r="4" fill="#ef4444" />
    <circle cx="44" cy="23" r="4" fill="#f59e0b" />
    <circle cx="60" cy="23" r="4" fill="#34d399" />
    <text x="20" y="60" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" fill="#0f766e">$ whoami</text>
    <text x="20" y="84" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#2563eb">Raja Muhammad Awais</text>
    <text x="20" y="112" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" fill="#0f766e">$ skills</text>
    <text x="20" y="136" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14" fill="#334155">Linux Docker Kubernetes Terraform AWS</text>
    <text x="20" y="158" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14" fill="#334155">Python FastAPI Node.js NestJS React</text>
    <text x="20" y="180" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" fill="#0f766e">$ status</text>
    <text x="20" y="204" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#2563eb">READY</text>
  </g>
  <g transform="translate(860 220)">
    <rect x="0" y="0" width="430" height="220" rx="10" fill="#f8fbff" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="24" y="36" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#2563eb">[metrics]</text>
    <text x="24" y="66" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#0f766e">CPU Usage    62%  ████████░░</text>
    <text x="24" y="90" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#0f766e">Memory Usage 74%  ████████░░</text>
    <text x="24" y="114" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#0f766e">Cluster Status  ONLINE</text>
    <text x="24" y="138" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#0f766e">Security Status VERIFIED</text>
    <text x="24" y="162" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#0f766e">Cloud Connected  YES</text>
    <text x="24" y="186" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#0f766e">GitHub Sync      READY</text>
    <circle cx="392" cy="168" r="8" fill="#34d399" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="210" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#0f766e">AI Model Loaded • Deployment Success</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="100%" height="auto" role="img" aria-label="Optimized animated terminal banner for Raja Muhammad Awais">
  <title>Raja Muhammad Awais Terminal Banner Optimized</title>
  <defs>
